<html>
<head>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

<input type="text" id="nombre" placeholder="nombre">
<br><br>
<input type="number" id="cantidad" placeholder="cantidad">
<br><br>
<input type="number" id="precio" placeholder="precio">

<br><br>

<button id="btnInsertar">Insertar</button>
<button id="btnActualizar">Actualizar</button>
<button id="btnBuscar">Buscar</button>

<div id="resultado"></div>

<script>

const apiUrl = "http://localhost/api/api.php";


$(document).ready(function(){

    listar();

});


function listar(nombre=""){

    let url = apiUrl;

    if(nombre != ""){
        url += "?nombre=" + nombre;
    }

    $.ajax({

        url: url,
        type: "GET",
        dataType: "json",

        success: function(response){

            let tabla = `
            <table border=1>
            <tr>
            <th>nombre</th>
            <th>cantidad</th>
            <th>precio</th>
            <th>accion</th>
            </tr>
            `;

            response.forEach(e => {

                tabla += `
                <tr>

                <td>${e.nombre}</td>
                <td>${e.cantidad}</td>
                <td>${e.precio}</td>

                <td>

                <button onclick="editar(
                '${e.nombre}',
                '${e.cantidad}',
                '${e.precio}'
                )">
                editar
                </button>

                <button onclick="eliminarFila(
                '${e.nombre}'
                )">
                eliminar
                </button>

                </td>

                </tr>
                `;

            });

            tabla += "</table>";

            $("#resultado").html(tabla);

        },

        error:function(){

            alert("Error al listar");

        }

    });

}


$("#btnInsertar").click(function(){

    $.ajax({

        url: apiUrl,
        type: "POST",
        dataType: "json",

        data:{
            nombre: $("#nombre").val(),
            cantidad: $("#cantidad").val(),
            precio: $("#precio").val()
        },

        success:function(){

            alert("Insertado");
            listar();

        },

        error:function(){

            alert("Error al insertar");

        }

    });

});



$("#btnActualizar").click(function(){

    $.ajax({

        url: apiUrl +
        "?nombre=" + $("#nombre").val() +
        "&cantidad=" + $("#cantidad").val() +
        "&precio=" + $("#precio").val(),

        type: "PUT",
        dataType: "json",

        success:function(){

            alert("Actualizado");
            listar();

        },

        error:function(){

            alert("Error al actualizar");

        }

    });

});



$("#btnBuscar").click(function(){

    let nombre = $("#nombre").val();

    listar(nombre);

});



function editar(nombre,cantidad,precio){

    $("#nombre").val(nombre);
    $("#cantidad").val(cantidad);
    $("#precio").val(precio);

}


function eliminarFila(nombre){

    $.ajax({

        url: apiUrl + "?nombre=" + nombre,
        type: "DELETE",
        dataType: "json",

        success:function(){

            alert("Eliminado");
            listar();

        },

        error:function(){

            alert("Error al eliminar");

        }

    });

}

</script>

</body>
</html>
